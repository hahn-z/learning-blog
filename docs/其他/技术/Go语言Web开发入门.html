<h1>Go语言Web开发入门</h1>

<p>Go 语言凭借其简洁的语法、出色的并发模型和丰富的标准库，成为 Web 后端开发的热门选择。</p>

<h2>使用 Gin 框架</h2>

<pre><code class="language-go">r := gin.Default()
r.GET(&quot;/api/hello&quot;, func(c *gin.Context) {
    c.JSON(200, gin.H{&quot;message&quot;: &quot;Hello!&quot;})
})</code></pre>

<p>Go 的 Web 生态正在快速发展，现在正是学习的好时机！</p>
